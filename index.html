<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGMI Admin Panel</title>
    <style>
        body { background-color: #0a0a0f; color: #fff; font-family: monospace; padding: 20px; }
        h2 { color: #00ff41; margin-bottom: 10px; font-size: 18px; text-transform: uppercase; letter-spacing: 1px;}
        input, textarea, button { background: #111; color: #fff; border: 1px solid #00ff41; padding: 12px; margin: 5px 0; width: 100%; box-sizing: border-box; border-radius: 5px; font-family: monospace; font-size: 14px;}
        textarea { resize: vertical; min-height: 60px; }
        button { cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { opacity: 0.8; }
        .danger { background: #ff003c; color: #fff; border: none; }
        .success { background: #00ff41; color: #000; border: none; }
        .warning { background: #ff9800; color: #000; border: none; }
        .info { background: #00e5ff; color: #000; border: none; }
        .box { border: 1px solid #333; padding: 20px; margin-bottom: 20px; border-radius: 8px; background: #111; box-shadow: 0 0 10px rgba(0, 255, 65, 0.1); }
        .hidden { display: none; }
        .key-item { border-bottom: 1px solid #333; padding: 15px; font-size: 13px; background: #1a1a24; border-radius: 5px; margin-bottom: 10px;}
        .green { color: #00ff41; }
        .red { color: #ff003c; }
        .cyan { color: #00e5ff; }
        .copy-btn { background: #00e5ff; color: #000; padding: 8px; font-size: 12px; border-radius: 3px; margin-top: 10px; width: auto; border: none; display: inline-block;}
        .btn-group { display: flex; gap: 10px; margin-top: 5px; }
        .btn-group button { margin: 0; }
        .lock-box { display: flex; justify-content: space-between; align-items: center; margin-top: 15px;}
        .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ff003c; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #00ff41; }
        input:checked + .slider:before { transform: translateX(26px); }
    </style>
</head>
<body>

    <div id="loginBox" class="box">
        <h2>🔐 ADMIN LOGIN</h2>
        <input type="password" id="adminPass" placeholder="Enter Password">
        <button onclick="login()">LOGIN</button>
    </div>

    <div id="mainPanel" class="hidden">
        <div class="box">
            <h2>🌐 DATABASE URL</h2>
            <input type="text" id="dbUrl" placeholder="https://xxx.firebaseio.com/">
            <div class="btn-group">
                <button onclick="saveDb()" class="success">SAVE</button>
                <button onclick="updateDb()" class="warning">UPDATE</button>
                <button onclick="deleteDb()" class="danger">DELETE</button>
            </div>
        </div>

        <div class="box">
            <h2>🔑 API KEYS (10 SLOTS)</h2>
            <div id="apiSlots">
                <input type="text" id="apiKey1" placeholder="API Key 1">
                <input type="text" id="apiKey2" placeholder="API Key 2">
                <input type="text" id="apiKey3" placeholder="API Key 3">
                <input type="text" id="apiKey4" placeholder="API Key 4">
                <input type="text" id="apiKey5" placeholder="API Key 5">
                <input type="text" id="apiKey6" placeholder="API Key 6">
                <input type="text" id="apiKey7" placeholder="API Key 7">
                <input type="text" id="apiKey8" placeholder="API Key 8">
                <input type="text" id="apiKey9" placeholder="API Key 9">
                <input type="text" id="apiKey10" placeholder="API Key 10">
            </div>
            <div class="btn-group">
                <button onclick="saveApi()" class="success">SAVE APIs</button>
                <button onclick="updateApi()" class="warning">UPDATE APIs</button>
                <button onclick="deleteApi()" class="danger">DELETE APIs</button>
            </div>
        </div>

        <div class="box">
            <h2>⚡ TEST API ONLINE</h2>
            <div id="apiTestButtons" style="margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 10px;"></div>
            <div id="apiTestResult" style="font-size: 14px; font-weight: bold; margin-top: 10px;"></div>
        </div>

        <div class="box">
            <h2>📢 CUSTOM NOTIFICATION & CRASH MESSAGE</h2>
            <input type="text" id="notifTitle" placeholder="Notification Title" value="App Locked By Owner">
            <textarea id="notifMessage" placeholder="Notification Message" style="min-height: 80px;">Lock Apply Within 10s. Agar tum 10s baad open kroge toh open nahi hoga!</textarea>
            <button onclick="saveNotif()" class="success">SAVE & UPDATE MESSAGE</button>
        </div>

        <div class="box">
            <h2>🛑 APP LOCK STATUS</h2>
            <div class="lock-box">
                <div id="lockStatusText" style="font-size: 16px; font-weight: bold; color: #00ff41;">Status: UNLOCKED</div>
                <label class="switch">
                    <input type="checkbox" id="lockSwitch" onchange="toggleKill()">
                    <span class="slider"></span>
                </label>
            </div>
            <div style="font-size: 11px; color: #888; margin-top: 10px;">Turn ON to crash all users instantly.</div>
        </div>

        <div class="box">
            <h2>🔑 GENERATE NEW KEY</h2>
            <input type="text" id="keyName" placeholder="Key Name (e.g. VIP-USER)">
            <input type="text" id="keyExpiry" placeholder="Expiry (1m, 1h, 1d, 7d)">
            <button onclick="generateKey()" class="success">GENERATE KEY</button>
            <div id="newKeyDisplay" class="hidden" style="margin-top:15px; border:1px dashed #00ff41; padding:15px; background: #000;">
                <div id="newKeyText" style="white-space: pre-wrap; line-height: 1.5; color: #00e5ff;"></div>
                <button class="copy-btn" onclick="copyGeneratedKey()">📋 COPY KEY DETAILS</button>
            </div>
        </div>

        <div class="box">
            <h2>📋 ALL KEYS & DETAILS</h2>
            <button onclick="fetchKeys()" class="info">REFRESH LIST</button>
            <div id="keyList" style="margin-top:15px;"></div>
        </div>
    </div>

    <script>
        const dbUrlInput = document.getElementById('dbUrl');
        dbUrlInput.value = localStorage.getItem('dbUrl') || '';
        let generatedKeyText = "";

        function login() {
            const pass = document.getElementById('adminPass').value;
            if (pass === "veil") { 
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('mainPanel').classList.remove('hidden');
                fetchKillStatus();
                fetchKeys();
                fetchApis();
                fetchNotification();
            } else { alert("Wrong Password"); }
        }

        // --- FIX: Database URL Save with Firebase REST API ---
        async function saveDb() {
            const db = dbUrlInput.value.trim();
            if (!db) return alert("Enter DB URL");
            if (!db.endsWith('/')) { dbUrlInput.value = db + '/'; }
            localStorage.setItem('dbUrl', dbUrlInput.value);
            
            // Save URL to Firebase Cloud so App can fetch
            await fetch(`${dbUrlInput.value}settings/config.json`, { 
                method: 'PUT', 
                body: JSON.stringify({ db_url: dbUrlInput.value }) 
            });
            alert("DB URL Saved & Pushed to Cloud!");
        }

        function updateDb() { saveDb(); alert("DB URL Updated in Cloud!"); }
        function deleteDb() {
            if(confirm("Delete Database URL?")) { localStorage.removeItem('dbUrl'); dbUrlInput.value = ""; alert("DB URL Deleted Locally!"); }
        }

        async function saveApi() {
            const db = dbUrlInput.value;
            if (!db) return alert("Save DB URL first");
            let updateData = { db_url: db }; // Add db_url here as well to keep it safe
            for(let i=1; i<=10; i++) { updateData[`api_key_${i}`] = document.getElementById(`apiKey${i}`).value.trim(); }
            
            // Save APIs to Cloud
            await fetch(`${db}settings/config.json`, { 
                method: 'PATCH', 
                body: JSON.stringify(updateData) 
            });
            alert("APIs Saved to Cloud!");
            fetchApis();
        }
        function updateApi() { saveApi(); }
        function deleteApi() {
            if(confirm("Clear all API Keys?")) { for(let i=1; i<=10; i++) { document.getElementById(`apiKey${i}`).value = ""; } saveApi(); }
        }

        async function fetchApis() {
            const db = dbUrlInput.value;
            if (!db) return;
            try {
                const res = await fetch(`${db}settings/config.json`);
                const data = await res.json();
                const testBtnContainer = document.getElementById('apiTestButtons');
                testBtnContainer.innerHTML = "";
                if (data) {
                    for(let i=1; i<=10; i++) {
                        const keyVal = data[`api_key_${i}`] || "";
                        document.getElementById(`apiKey${i}`).value = keyVal;
                        if(keyVal.trim() !== "") {
                            const btn = document.createElement('button');
                            btn.innerText = `Test API Slot ${i}`;
                            btn.className = "info"; btn.style.width = "auto";
                            btn.onclick = () => testApi(keyVal, i);
                            testBtnContainer.appendChild(btn);
                        }
                    }
                }
            } catch(e) {}
        }

        async function testApi(apiKey, slotNumber) {
            const resDiv = document.getElementById('apiTestResult');
            resDiv.innerHTML = `<span style="color:#00e5ff;">Testing Slot ${slotNumber}... Please wait.</span>`;

            const targetUrl = `https://delvorn.vynqo.in/api/attack/start?key=${apiKey}&ip=1.1.1.1&port=80&time=10`;
            
            try {
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
                const response = await fetch(proxyUrl);
                const text = await response.text();
                
                if (text.includes('"status": "success"') || text.includes('"status":"success"') || text.includes('Attack dispatched')) {
                    resDiv.innerHTML = `<span class="green">✅ API TEST PASS (Slot ${slotNumber} is Online)</span><br><small>${text}</small>`;
                } else {
                    resDiv.innerHTML = `<span class="red">❌ API TEST FAIL (Slot ${slotNumber} Error)</span><br><small>${text}</small>`;
                }
            } catch (error) {
                resDiv.innerHTML = `<span class="red">❌ API TEST FAIL (Network Error / Invalid API)</span>`;
            }
        }

        async function saveNotif() {
            const db = dbUrlInput.value;
            if (!db) return alert("Save DB URL first");
            const title = document.getElementById('notifTitle').value;
            const message = document.getElementById('notifMessage').value;
            await fetch(`${db}settings/notification.json`, { method: 'PUT', body: JSON.stringify({ title: title, message: message }) });
            alert("Notification Message Saved!");
        }

        async function fetchNotification() {
            const db = dbUrlInput.value;
            if (!db) return;
            try {
                const res = await fetch(`${db}settings/notification.json`);
                const data = await res.json();
                if (data) {
                    document.getElementById('notifTitle').value = data.title || "App Locked By Owner";
                    document.getElementById('notifMessage').value = data.message || "Lock Apply Within 10s...";
                }
            } catch(e) {}
        }

        async function toggleKill() {
            const db = dbUrlInput.value;
            if (!db) return alert("Save DB URL first");
            const isChecked = document.getElementById('lockSwitch').checked;
            await fetch(`${db}settings/app_blocked.json`, { method: 'PUT', body: JSON.stringify(isChecked) });
            fetchKillStatus();
        }

        async function fetchKillStatus() {
            const db = dbUrlInput.value;
            if (!db) return;
            try {
                const res = await fetch(`${db}settings/app_blocked.json`);
                const status = await res.json();
                const statusText = document.getElementById('lockStatusText');
                const switchBtn = document.getElementById('lockSwitch');
                if (status === true) {
                    statusText.innerText = "Status: LOCKED (App Crashed)"; statusText.style.color = "#ff003c"; switchBtn.checked = true;
                } else {
                    statusText.innerText = "Status: UNLOCKED"; statusText.style.color = "#00ff41"; switchBtn.checked = false;
                }
            } catch (e) {}
        }

        function formatTime(timestamp) {
            if (!timestamp || timestamp === 0) return "N/A";
            const d = new Date(timestamp);
            return d.toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' });
        }

        async function generateKey() {
            const db = dbUrlInput.value;
            const name = document.getElementById('keyName').value;
            const expiry = document.getElementById('keyExpiry').value;
            if (!db || !name || !expiry) return alert("Fill all fields");

            let timeMs = 0;
            if (expiry.endsWith('m')) timeMs = parseInt(expiry) * 60000;
            else if (expiry.endsWith('h')) timeMs = parseInt(expiry) * 3600000;
            else if (expiry.endsWith('d')) timeMs = parseInt(expiry) * 86400000;

            const expiryTime = Date.now() + timeMs;
            await fetch(`${db}keys/${name}.json`, { method: 'PUT', body: JSON.stringify({ expiry: expiryTime, blocked: false, firstUsed: 0 }) });
            
            generatedKeyText = `🖤 ◆ 𝐊𝐞𝐲 ➪ ${name}\n👼 ◆ 𝐃𝐮𝐫𝐚𝐭𝐢𝐨𝐧 ➪ ${expiry}\n🍂 ◆ 𝐆𝐞𝐧𝐞𝐫𝐚𝐭𝐞 𝐓𝐢𝐦𝐞 ➪ ${formatTime(Date.now())}\n🪼 ◆ 𝐄𝐱𝐩𝐢𝐫𝐲 𝐓𝐢𝐦𝐞 ➪ ${formatTime(expiryTime)}\n◆ 𝐍𝐨𝐭𝐞 ➪ 𝐄𝐱𝐩𝐢𝐫𝐲 𝐬𝐭𝐚𝐫𝐭𝐬 𝐰𝐡𝐞𝐧 𝐮𝐬𝐞𝐫 𝐥𝐨𝐠𝐬 𝐢𝐧 ◆`;
            
            document.getElementById('newKeyDisplay').classList.remove('hidden');
            document.getElementById('newKeyText').innerText = generatedKeyText;
            document.getElementById('keyName').value = '';
            fetchKeys();
        }

        function copyGeneratedKey() {
            navigator.clipboard.writeText(generatedKeyText).then(() => { alert("Key Details Copied!"); });
        }

        async function fetchKeys() {
            const db = dbUrlInput.value;
            if (!db) return;
            try {
                const res = await fetch(`${db}keys.json`);
                const data = await res.json();
                let html = "";
                if (data) {
                    for (let key in data) {
                        const k = data[key];
                        const status = k.blocked ? "BLOCKED" : "ACTIVE";
                        const color = k.blocked ? "red" : "green";
                        const usedStatus = (k.firstUsed === 0 || k.firstUsed === undefined) ? "NOT USED YET" : "USED";
                        const device = k.device || "None";
                        
                        let timeLeft = "Not Started";
                        if (k.firstUsed !== 0 && k.firstUsed !== undefined) {
                            const remaining = k.expiry - Date.now();
                            if (remaining > 0) timeLeft = Math.floor(remaining/1000) + "s left";
                            else timeLeft = "EXPIRED";
                        }

                        html += `
                            <div class="key-item">
                                <b class="cyan">${key}</b> <br>
                                <span class="${color}">STATUS: ${status}</span> | <span class="green">${usedStatus}</span><br>
                                <b>Device:</b> ${device}<br>
                                <b>Expiry:</b> ${formatTime(k.expiry)}<br>
                                <b>Time Left:</b> ${timeLeft}<br>
                                <div class="btn-group">
                                    <button class="danger" style="padding:5px 10px; font-size:12px; margin-top:8px;" onclick="deleteKey('${key}')">DELETE</button>
                                    <button class="success" style="padding:5px 10px; font-size:12px; margin-top:8px;" onclick="toggleBlockKey('${key}', ${!k.blocked})">${k.blocked ? 'UNBLOCK' : 'BLOCK'}</button>
                                </div>
                            </div>
                        `;
                    }
                }
                document.getElementById('keyList').innerHTML = html || "No keys found.";
            } catch (e) {}
        }

        async function toggleBlockKey(key, blockStatus) {
            const db = dbUrlInput.value;
            await fetch(`${db}keys/${key}.json`, { method: 'PATCH', body: JSON.stringify({ blocked: blockStatus }) });
            fetchKeys();
        }

        async function deleteKey(key) {
            const db = dbUrlInput.value;
            if (confirm("Delete this key permanently?")) {
                await fetch(`${db}keys/${key}.json`, { method: 'DELETE' });
                fetchKeys();
            }
        }
    </script>
</body>
</html>
